name: CI-check-no-dist-update

# Upstream rejects bundle changes; the fork verifies manually published bundles.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dist/**'

permissions:
  contents: read

jobs:
  fail-on-dist-update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        files: |
          dist/**

    - name: Print changes to dist directory
      env:
        ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      run: |
        for file in ${ALL_CHANGED_FILES}; do
          echo "$file was changed"
        done

    - name: Setup Node for fork bundle verification
      if: github.repository == 'jobandtalent/gradle-actions'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: sources/package-lock.json

    - name: Verify published fork bundles match source
      if: github.repository == 'jobandtalent/gradle-actions'
      run: |
        npm ci --prefix sources
        npm run compile --prefix sources
        diff -r sources/dist dist

    - name: Reject bundle updates outside the fork
      if: github.repository != 'jobandtalent/gradle-actions'
      run: |
        echo "The 'dist' directory is automatically updated by the release process."
        echo "It should not be updated manually in a non-release branch or a pull request."
        exit 1
