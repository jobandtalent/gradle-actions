name: suite-integ-test-other

on:
  workflow_call:
    inputs:
      runner-os:
        type: string
        default: '["ubuntu-latest"]'
      skip-dist:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  develocity-credentials:
    if: ${{ ! github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
    - name: Check Develocity credentials
      id: check
      shell: bash
      env:
        DEVELOCITY_ACCESS_KEY: ${{ secrets.DV_SOLUTIONS_ACCESS_KEY }}
      run: |
        if [ -n "$DEVELOCITY_ACCESS_KEY" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping Develocity injection tests: DV_SOLUTIONS_ACCESS_KEY is not configured."
        fi

  build-scan-publish:
    uses: ./.github/workflows/integ-test-build-scan-publish.yml
    with:
      runner-os: '${{ inputs.runner-os }}'
      skip-dist: ${{ inputs.skip-dist }}

  develocity-injection:
    needs: develocity-credentials
    if: ${{ needs.develocity-credentials.outputs.available == 'true' }}
    uses: ./.github/workflows/integ-test-inject-develocity.yml
    with:
      skip-dist: ${{ inputs.skip-dist }}
    secrets:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DV_SOLUTIONS_ACCESS_KEY }}

  provision-gradle-versions:
    uses: ./.github/workflows/integ-test-provision-gradle-versions.yml
    with:
      runner-os: '${{ inputs.runner-os }}'
      skip-dist: ${{ inputs.skip-dist }}

  toolchain-detection:
    uses: ./.github/workflows/integ-test-detect-toolchains.yml
    with:
      skip-dist: ${{ inputs.skip-dist }}

  wrapper-validation:
    uses: ./.github/workflows/integ-test-wrapper-validation.yml
    with:
      runner-os: '${{ inputs.runner-os }}'
      skip-dist: ${{ inputs.skip-dist }}
